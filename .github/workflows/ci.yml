name: Validate Yingira
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node_modules/.bin/supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /tmp/yingira-start.log 2>&1
      - run: npm run setup:local
      - run: npm run test:staff
      - run: npm run test:planning
      - run: npm run test:db
      - run: node_modules/.bin/supabase db advisors --local --type security --level warn --fail-on error
      - run: node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        run: node_modules/.bin/supabase stop --project-id Yingira_App
